# Конфигурация проекта. Формат: КЛЮЧ=значение, комментарий - отдельной строкой с '#'.
# Пути - абсолютные или относительно папки board.
# Числа, IP, MAC и "строки" попадают в fpga\rtl\kvm_config_pkg.sv и firmware\include\kvm_config.h (gen-config.ps1).

# ---------- Инструменты ----------
GOWIN_BIN=C:\Gowin\Gowin_V1.9.11.03_Education_x64\IDE\bin
GOWIN_PROGRAMMER_BIN=C:\Gowin\Gowin_V1.9.11.03_Education_x64\Programmer\bin
# xPack GNU RISC-V Embedded GCC (setup.ps1 скачивает версию RISCV_GCC_VERSION сюда, если папки нет)
RISCV_DIR=tools\xpack-riscv
RISCV_PREFIX=riscv-none-elf-
RISCV_GCC_VERSION=15.2.0-1
# make_hex и merge_bit из SDK Gowin_PicoRV32 (setup.ps1 берёт их из архива PICORV32_SDK_ZIP)
PICORV32_SDK_DIR=tools\gowin_picorv32
PICORV32_SDK_ZIP=tools\Gowin_PicoRV32_V1.7.zip

# ---------- FPGA ----------
FPGA_PROJECT=PRIMER_KVM
FPGA_TOP=kvm_top
FPGA_DEVICE=GW2A-18C
FPGA_PART=GW2A-LV18PG256C8/I7
FPGA_DEVICE_ID=gw2a18c-011
# Кабель programmer_cli (встроенный отладчик Dock)
PROG_CABLE=Gowin USB Cable(FT2CH)
# Запас по частоте каждого такта, % (synth.ps1: меньше - ошибка сборки)
TIMING_MARGIN_PCT=15

# ---------- Ядро PicoRV32 ----------
CPU_ITCM_KB=32
CPU_DTCM_KB=8
# 27 МГц / 2 * 3 (VCO 648 МГц)
CPU_CLK_HZ=40500000
CPU_UART_BAUD=115200
# WB GPIO: LED0..5
CPU_GPIO_WIDTH=6
FW_NAME=kvm_fw

# ---------- Плата ----------
CLK_IN_HZ=27000000

# ---------- Вход HDMI (модуль PMOD_DVI в J6): режим из EDID, 1280x720@60 ----------
VIDEO_H_ACTIVE=1280
VIDEO_V_ACTIVE=720
VIDEO_PIXEL_CLK_HZ=74250000
VIDEO_H_FRONT=110
VIDEO_H_SYNC=40
VIDEO_H_BACK=220
VIDEO_V_FRONT=5
VIDEO_V_SYNC=5
VIDEO_V_BACK=20
VIDEO_HSYNC_POS=1
VIDEO_VSYNC_POS=1
# Фаза выборки IP DVI RX: auto или 0..15. Задержка входа канала (0 - синий, 1 - зелёный, 2 - красный): 0..127, шаг ~18 пс.
HDMI_PHASE=auto
HDMI_CH0_IODELAY=0
HDMI_CH1_IODELAY=0
HDMI_CH2_IODELAY=0

# ---------- DDR3 (H5TQ1G63EFR, 128 МБ) ----------
# 27 МГц / 2 * 23; логика DDR3 - 1/4 этой частоты
DDR_MEM_CLK_HZ=310500000
DDR_ROW_BITS=13

# ---------- Сеть (прямое подключение к ПК) ----------
NET_IP_ADDR=192.168.50.10
NET_MAC_ADDR=02:4B:56:4D:00:01
NET_UDP_PORT=50000
# Адаптер ПК для pc-net-setup.ps1: описание (можно с *) и адрес
NET_PC_ADAPTER=Realtek USB GbE*
NET_PC_IP_ADDR=192.168.50.1
